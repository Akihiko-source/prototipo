<div class="card st"><small>Completadas${ic('check',18,'#10B981')}</small><b style="color:var(--g)">${8-pend()}</b><span>Encuestas enviadas</span></div></div>

enc:()=>{const l=courses.filter(c=>S.f=='all'||(S.f=='pend')==!!c.p);const T=(k,n,c)=>`<button class="${S.f==k?'on':''}" onclick="S.f='${k}';draw()">${n} (${c})</button>`;
return `${hd('Evaluaciones Docentes','Selecciona una encuesta pendiente para iniciar')}<div class="pad" style="padding-top:14px"><div class="tabs">${T('all','Todas',8)}${T('pend','Pendientes',pend())}${T('done','Completas',8-pend())}</div>
${l.map(c=>`<div class="card sv"><div class="tg"><i>${c.id}</i><i class="t">${c.ty}</i>${c.p?`<u>${ic('clock',13,'#E11D48')}Vence: ${c.v}</u>`:`<u class="ok" style="color:var(--g)">${ic('check',13,'#10B981')}Enviada</u>`}</div><h3>${c.n}</h3><p>${c.d}</p><div class="ft"><span>Estimado: 5 min</span>${c.p?`<button class="rb" onclick="start('${c.id}')">Evaluar</button>`:`<span class="ok">Completada</span>`}</div></div>`).join('')||'<p style="text-align:center;color:var(--mut);padding:40px 0;font-size:13px">No hay encuestas en esta categoría.</p>'}</div>`},
quiz:()=>{const c=courses.find(x=>x.id==S.c),n=S.sec,s=secs[n-1];let b='';

if(n==4)b=`<div class="q"><h4>¿Tiene algún comentario o sugerencia para mejorar el curso?</h4></div><textarea id="tx" maxlength="500" placeholder="Excelente docente, siempre absuelve dudas de manera clara y utiliza recursos prácticos en Canvas. Me gustaría que incluya más ejercicios resueltos en las diapositivas de clase." oninput="S.cm=this.value;$('cc').textContent=this.value.length+' / 500'">${S.cm}</textarea><div class="cn"><span>Evite usar lenguaje ofensivo.</span><b id="cc">${S.cm.length} / 500</b></div>
<div class="tgl">${ic('shield',20,'#10B981')}<div><b>Comentario Anónimo</b><span>Se ocultará tu identidad en los comentarios.</span></div><button class="sw ${S.an?'on':''}" onclick="S.an=!S.an;this.classList.toggle('on')" aria-label="Anónimo"></button></div>`;
if(n==5){const all=[].concat(...secs.slice(0,3).map((s,i)=>s.qs.map((q,j)=>[q,S.rate[(i+1)+'-'+j]||0])));b=all.map(a=>`<div class="sm"><span>${a[0]}</span><b style="color:#F5B301">${'★'.repeat(a[1])}<span style="color:#CBD2DC">${'★'.repeat(5-a[1])}</span></b></div>`).join('')+`<div class="sm"><span>Comentario</span><b>${S.cm?S.cm.slice(0,22)+(S.cm.length>22?'…':''):'—'}</b></div><div class="sm"><span>Modo anónimo</span><b>${S.an?'Activado':'Desactivado'}</b></div>`}
return `<div class="cbox">${hd(c.n,'Evaluando a: '+c.d,'enc')}<div class="pg"><div class="rw"><span>Progreso general</span><b>${n} de 5 secciones</b></div><div class="bar"><i style="width:${n*20}%"></i></div></div>
<div class="sec">${ic(n==5?'check':'chat',20,'#fff')}Sección ${n}: ${s.t}</div><div class="card" style="margin:0 18px;flex:1;overflow:auto;max-height:420px">${b}</div><div style="flex:1"></div>
<div class="ft2"><button class="b1" onclick="${n==1?"go('enc')":'nav2(-1)'}">Anterior</button><button class="b2" onclick="nav2(1)">${n==5?'Enviar':'Siguiente'}</button></div></div>`},
ok:()=>{const c=courses.find(x=>x.id==S.c);return `<div class="cbox" style="padding:0 20px 28px"><div style="flex:1;display:flex;flex-direction:column;align-items:center;padding-top:36px;text-align:center">
<svg width="224" height="224" viewBox="0 0 224 224"><circle cx="112" cy="112" r="102" fill="#fff" stroke="#6DD400" stroke-width="20"/><ellipse cx="78" cy="118" rx="20" ry="8" fill="#BCC3D6"/><ellipse cx="146" cy="118" rx="20" ry="8" fill="#BCC3D6"/><path d="M76 94q10-14 20 0M128 94q10-14 20 0" stroke="#1E2340" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="112" cy="138" rx="28" ry="20" fill="#1E2340"/><ellipse cx="112" cy="146" rx="17" ry="10" fill="#BCC3D6"/></svg>
<h1 style="font-size:24px;font-weight:800;margin-top:34px">¡Evaluación Enviada!</h1><p style="font-size:13.5px;color:#5A6580;margin:8px 0 28px">La encuesta ha sido procesada de manera segura.</p>
<div class="card" style="width:100%;text-align:left;padding:20px"><small style="font-weight:700;color:var(--mut);font-size:11px">RESUMEN DE ENVÍO</small><div style="margin-top:12px;font-size:13px;color:#5A6580;display:grid;gap:11px"><div class="rw"><span>Curso:</span><b style="color:var(--ink)">${c.n} (${c.id})</b></div><div class="rw"><span>Docente:</span><b style="color:var(--ink)">${c.d}</b></div><div class="rw"><span>Fecha y hora:</span><b style="color:var(--ink)">${S.when}</b></div><div class="rw"><span>Modo anónimo:</span><span class="tag">${S.an?'Activado':'Desactivado'}</span></div></div>
<div style="border-top:1px solid var(--ln);margin-top:14px;padding-top:14px;display:flex;gap:10px;font-size:11px;color:var(--mut);line-height:1.4">${ic('shield',18,'#E11D48')}<span>Tus respuestas se han anonimizado. Tu código de estudiante no se vinculará a las calificaciones entregadas al docente.</span></div></div></div>
<button class="lb" onclick="go('home','home')" style="padding:16px">Volver al Inicio</button></div>`},
res:()=>`${hd('Programación I','Resultados agregados: Prof. Roberto Diaz','home')}<div class="pad"><div class="card" style="display:flex;gap:18px;align-items:center;margin-bottom:16px">${donut(4.2,98,12,'#8792A9','/ 5.0',26)}<div><h3 style="font-size:13px;color:var(--h);font-weight:700">Desempeño general</h3><p style="font-size:11.5px;color:#5A6580;margin:5px 0 8px;line-height:1.35">Calificación promedio basada en la encuesta actual.</p><span class="tag" style="display:inline-flex;gap:5px;align-items:center">${ic('user',12,'#10B981')}78% participación</span></div></div>
<div class="card" style="margin-bottom:16px"><h3 style="font-size:14px;color:var(--h);margin-bottom:16px">Resultados por Categoría</h3>${[['Metodología',4.5],['Puntualidad',4.0],['Comunicación',4.3],['Evaluación',3.8],['Recursos',4.4]].map(a=>`<div class="cat"><span>${a[0]}</span><div class="bar"><i style="width:${a[1]*20}%"></i></div><em>${a[1].toFixed(1)}</em></div>`).join('')}</div>
<div class="card rw"><div><h3 style="font-size:14px">Tendencia del Semestre</h3><p>Comparado con ciclos anteriores</p></div><b style="font-size:13px;color:var(--g)">${ic('up',16,'#10B981')}&nbsp;+4.8%</b></div></div>`,
perf:()=>`${hd('Mi Perfil','Estudiante UTP')}<div class="pad"><div class="card" style="text-align:center"><div class="ph" style="margin:0 auto 10px;width:72px;height:72px;font-size:26px">M</div><h3 style="font-size:17px">Mateo</h3><p style="font-size:12px;color:var(--mut);margin:4px 0 16px">Código: ${S.code||'U21304562'} · Ciclo 2026-I</p><button class="lb" onclick="S.code='';go('login')">Cerrar sesión</button></div></div>`

function donut(v,sz,sw,tc,sub,fs){const r=(sz-sw)/2,C=2*Math.PI*r;return `<div style="position:relative;width:${sz}px;height:${sz}px;flex:none"><svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#E3E8ED" stroke-width="${sw}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#E11D48" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C*v/5} ${C}"/></svg><div style="position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:${tc}"><b style="font-size:${fs}px;line-height:1">${v}</b><small style="font-size:9px">${sub}</small></div></div>`}
function login(){const c=$('cod').value.trim(),p=$('pw').value;if(!c||!p)return toast('Ingresa tu código y contraseña');S.code=c.toUpperCase();go('home','home')}
function start(id){S.c=id;S.sec=1;S.rate={};S.cm=SAMPLE;S.an=true;go('quiz')}
function rate(k,v){S.rate[k]=v;const d=document.querySelectorAll('.q')[+k.split('-')[1]];d.querySelector('.stars').innerHTML=ST(v,k)}
function nav2(d){const n=S.sec;if(d>0&&n<4&&secs[n-1].qs.some((q,i)=>!S.rate[n+'-'+i]))return toast('Califica todos los criterios');
if(d>0&&n==5){const D=new Date(),p=x=>String(x).padStart(2,'0'),h=D.getHours();S.when=`${p(D.getDate())}/${p(D.getMonth()+1)}/${D.getFullYear()} ${p(h%12||12)}:${p(D.getMinutes())} ${h<12?'AM':'PM'}`;courses.find(x=>x.id==S.c).p=0;return go('ok')}
S.sec+=d;draw()}

const hist=[4.1,4.3,4.2,4.4,4.3],hl=['2024-I (4.1)','2024-II (4.3)','2025-I (4.2)','2025-II (4.4)','2026-I (4.3)'];
let A={p:'dash',d:0};
const side=()=>`<aside class="sd"><div class="lgo"><span class="lg"><i>U</i><i>T</i><i>P</i></span><span style="color:#E11D48;font-size:22px">+</span>evalua</div>${[['dash','Dashboard','grid'],['doc','Docentes','user'],['enc','Encuestas','doc'],['rep','Reportes','bars'],['cfg','Configuración','cog']].map(a=>`<button class="${A.p==a[0]?'on':''}" onclick="A.p='${a[0]}';A.p=='doc'&&(A.d=A.d);adm()">${ic(a[2],16,'#fff')}${a[1]}</button>`).join('')}<div class="ad2"><span class="av">AU</span>Admin UTP</div></aside>`;

function line(){const W=600,H=150,xs=i=>40+i*(W-80)/4,ys=v=>H-20-(v-3.9)/0.7*100;const pts=hist.map((v,i)=>[xs(i),ys(v)]);
return `<div class="lc"><svg viewBox="0 0 ${W} ${H+20}" preserveAspectRatio="none">${[0,1,2].map(i=>`<line x1="0" x2="${W}" y1="${30+i*45}" y2="${30+i*45}" stroke="#EEF0F4"/>`).join('')}<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#F43F5E" stroke-width="2"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#E11D48" onmouseenter="tip(this,${i})" style="cursor:pointer" />`).join('')}</svg><div class="tip" id="tp"></div></div><div style="display:flex;justify-content:space-between;font-size:10px;color:#4A5472;padding:0 20px">${hl.map(l=>`<span>${l}</span>`).join('')}</div>`}
function tip(e,i){const t=$('tp'),b=e.getBoundingClientRect(),p=t.parentNode.getBoundingClientRect();t.textContent=hl[i].split(' ')[0]+': '+hist[i]+'/5.0';t.style.left=b.left-p.left+3+'px';t.style.top=b.top-p.top+'px';t.style.opacity=1}
function radar(v){const c=60,r=48,pt=(i,k)=>{const a=-Math.PI/2+i*2*Math.PI/5;return[(c+Math.cos(a)*r*k).toFixed(1),(c+Math.sin(a)*r*k).toFixed(1)].join(',')};
return `<svg width="120" height="120">${[1,.66,.33].map(k=>`<polygon points="${[0,1,2,3,4].map(i=>pt(i,k)).join(' ')}" fill="none" stroke="#E3E8ED"/>`).join('')}<polygon points="${v.map((x,i)=>pt(i,x/5)).join(' ')}" fill="#3B82F61a" stroke="#3B82F6" stroke-width="1.5"/></svg>`}

<div class="k4">${[['Total Encuestas','1,284','+12.4%','doc','#E11D48','#FDE7EC'],['Tasa de Respuesta','78.5%','+3.2%','check','#3B82F6','#E0ECFF'],['Promedio General','4.2 / 5.0','+0.4%','star','#10B981','#E0F7EE'],['Docentes Evaluados','156','100%','user','#4A5472','#E7E9EF']].map(k=>`<div class="pc"><small>${k[0]}<span class="ic" style="background:${k[5]}">${ic(k[3],14,k[4])}</span></small><b>${k[1]}</b><span>↑↑ ${k[2]} <span style="color:var(--mut);font-weight:500">${k[2]=='100%'?'':'este semestre'}</span></span></div>`).join('')}</div>

<div class="pc"><div class="rw"><div><h3>Tendencia Semestral (Histórico)</h3><p>Evolución del puntaje docente promedio durante los últimos ciclos</p></div><span style="font-size:10px;color:#4A5472;display:flex;gap:5px;align-items:center"><i class="dot" style="width:7px;height:7px"></i>Promedio General</span></div>${line()}</div>`;
else if(A.p=='doc'){const t=tops[A.d],cr=[['Metodología',4.8],['Comunicación',4.5],['Puntualidad',4.2],['Evaluación',4.0],['Recursos',4.6]];
m=`${tbar('Evaluación Detallada')}<div style="font-size:10px;color:var(--mut);margin:-6px 0 14px">Dashboard &gt; Docentes &gt; <span style="color:var(--r);font-weight:600">Prof. ${t[0]}</span></div>
<div class="pc hdr"><div class="ph">${t[0].split(' ').map(x=>x[0]).join('')}</div><div><h2>Prof. ${t[0]}<u>Contratado D.U.</u></h2><p>Departamento de ${t[1]}<br>ID Docente: U20150048 | Código de docente ordinario</p></div><div class="sc">${donut(+t[2],54,6,'#1E2340','de 5.0',14)}<span>Puntaje General<br><small style="color:var(--mut);font-weight:500">Rango Sobresaliente</small></span></div></div>
<div class="dt"><div class="dc"><div class="pc"><h3 style="margin-bottom:16px">Evaluación por Criterio Pedagógico</h3><div class="rd">${radar(cr.map(c=>c[1]))}<div style="flex:1">${cr.map(c=>`<div style="margin-bottom:11px"><div class="rw" style="font-size:11px;font-weight:700;margin-bottom:4px"><span>${c[0]}</span><span style="color:var(--r)">${c[1].toFixed(1)}</span></div><div class="bar" style="height:5px"><i style="width:${c[1]*20}%"></i></div></div>`).join('')}</div></div></div>
<div class="pc"><h3 style="margin-bottom:12px">Comentarios Anónimos de Estudiantes</h3>${[['Positivo','Excelente metodología de enseñanza. Explica de forma clara y siempre está dispuesta a absolver dudas durante la clase práctica.'],['Neutral','La docente es muy puntual y cumple a cabalidad con el sílabo, sin embargo, las evaluaciones son bastante complejas.'],['Positivo','Gran manejo de las herramientas virtuales y recursos interactivos de aprendizaje. Hace dinámicas las clases remotas.']].map((c,i)=>`<div class="cm"><small>Estudiante #0${i+1}<u class="${c[0]=='Neutral'?'n':''}">${c[0]}</u></small>"${c[1]}"</div>`).join('')}</div></div>
<div class="dc"><div class="pc dk"><h3>Acciones del Reporte</h3><button class="p" onclick="window.print()">Exportar Reporte PDF</button><button onclick="toast2('Reporte compartido con el docente')">Compartir con Docente</button></div>
<div class="pc"><h3 style="margin-bottom:12px">Desempeño Histórico</h3>${[['2025-II','4.5','Top 10%'],['2025-I','4.4','Top 12%'],['2024-II','4.2','Top 20%']].map(h=>`<div class="hi"><b>${h[0]}</b><span>${h[1]} / 5.0<small>${h[2]}</small></span></div>`).join('')}</div>
<div class="pc"><h3 style="margin-bottom:12px">Cursos Dictados este Ciclo</h3>${[['Cálculo II','SIS-102','42','#10B981'],['Programación I','SIS-204','38','#10B981'],['Algoritmos','SIS-301','35','#9CA3AF']].map(c=>`<div class="crs"><div>${c[0]}<small>${c[1]}</small></div><small>${c[2]} Alumn. <i class="dot" style="display:inline-block;width:6px;height:6px;background:${c[3]}"></i></small></div>`).join('')}</div></div></div>`}

a.innerHTML=`<div class="ad">${side()}<main class="mn">${m}</main></div>`;const c3=a.querySelectorAll(".lc circle")[3];c3&&tip(c3,3)}
